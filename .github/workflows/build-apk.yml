name: Build Sumit Ka App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip Sumit_Ka_App.zip
          
      - name: Build APK
        run: gradle -p "Sumit Ka App" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumit-Ka-App-APK
          path: "Sumit Ka App/app/build/outputs/apk/debug/app-debug.apk"
